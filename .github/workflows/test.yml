name: Test and package workspaces
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run core and workspace tests
        run: npm test
      - name: Check core publish contents (no release)
        run: npm pack --dry-run --workspace=core
